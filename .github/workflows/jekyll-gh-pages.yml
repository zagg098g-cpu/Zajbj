<body>

    <!-- Game Container -->
    <div class="game-container">
        <iframe src="https://dkwin12.com/#/register?invitationCode=13432437709"></iframe>
    </div>

    <!-- Main Orb UI (লগইনের আগেও ড্র্যাগ করা যাবে) -->
    <div class="cyber-orb" id="dragOrb">
        <div class="orb-outer-ring"></div>
        <div class="orb-core">
            <div class="orb-header">𝑴𝑰𝑻𝑯𝑼𝑵 𝑽𝑨𝑰 𝑶𝑾𝑵𝑬𝑹 ♡</div>
            <div id="orb-clock">00:00:00</div>

            <!-- Login Panel -->
            <div id="orb-login" style="display: flex; flex-direction: column; align-items: center; width: 100%;">
                <input type="text" id="key" class="orb-input" placeholder="PASSKEY">
                <button class="orb-btn" onclick="unlockOrb()">login</button>
                <div class="orb-actions" style="margin-top: 8px;">
                    <span class="action-icon" onclick="minimizeOrb()">HIDE</span>
                </div>
            </div>

            <!-- Dashboard Panel -->
            <div id="main-display" style="display: none; width: 100%; text-align: center;">
                <div class="result-container">
                    <div class="res-val" id="orb-res">WAITING</div>
                    <div class="timer-box"><span id="orb-timer">30</span>S</div>
                </div>
                
                <div class="orb-footer">
                    <a href="https://t.me/FUTURE_BANGLADESHBD" target="_blank" class="tg-orb">TELEGRAM</a>
                    <div class="orb-actions">
                        <span class="action-icon" onclick="minimizeOrb()">HIDE</span>
                        <span class="action-icon" onclick="location.reload()" style="color: #ff4444;">EXIT</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Mini Trigger with custom Image (আপনার দেওয়া ইমেজের ডিরেক্ট লিঙ্ক বসানো হয়েছে) -->
    <div id="mini-orb" onclick="maximizeOrb()">
        <img src="https://i.ibb.co/pvgPPz5Y/IMG-20260626-062932-703.jpg" alt="Logo">
    </div>

    <script>
        const PASS_KEY = "1234"; 
        
        const orb = document.getElementById("dragOrb");
        const miniOrb = document.getElementById("mini-orb");

        // Unlock System
        function unlockOrb() {
            const input = document.getElementById("key").value;
            if(input === PASS_KEY) {
                document.getElementById("orb-login").style.display = "none";
                document.getElementById("main-display").style.display = "flex";
                document.getElementById("main-display").style.flexDirection = "column";
                startEngine();
            } else {
                alert("ACCESS DENIED: WRONG PASSWORD");
            }
        }

        // --- উন্নত ড্র্যাগিং সিস্টেম (লগইন এর আগে ও পরে সব সময় কাজ করবে) ---
        function makeDraggable(element) {
            let isDragging = false;
            let offset = { x: 0, y: 0 };

            element.addEventListener('touchstart', (e) => {
                if(e.target.tagName === 'INPUT' || e.target.tagName === 'BUTTON' || e.target.tagName === 'A') return;
                isDragging = true;
                offset.x = e.touches[0].clientX - element.offsetLeft;
                offset.y = e.touches[0].clientY - element.offsetTop;
            }, { passive: false });

            document.addEventListener('touchmove', (e) => {
                if (!isDragging) return;
                let left = e.touches[0].clientX - offset.x;
                let top = e.touches[0].clientY - offset.y;
                
                // স্ক্রিনের বাইরে যাওয়া আটকানোর জন্য বাউন্ডারি সেট
                if (left < 0) left = 0;
                if (top < 0) top = 0;
                if (left > window.innerWidth - element.offsetWidth) left = window.innerWidth - element.offsetWidth;
                if (top > window.innerHeight - element.offsetHeight) top = window.innerHeight - element.offsetHeight;

                element.style.left = left + "px";
                element.style.top = top + "px";
                e.preventDefault();
            }, { passive: false });

            document.addEventListener('touchend', () => {
                isDragging = false;
            });
        }

        // দুটো এলিমেন্টকেই ড্র্যাগেবল করা হলো
        makeDraggable(orb);
        makeDraggable(miniOrb);

        // UI Controls
        window.minimizeOrb = () => {
            orb.style.display = "none";
            miniOrb.style.display = "flex";
        };

        window.maximizeOrb = () => {
            orb.style.display = "flex";
            miniOrb.style.display = "none";
        };

        // Engine Logic
        function startEngine() {
            const data = ["BIG 7,9", "SMALL 0,2", "SMALL 1,3", "BIG 6,8", "BIG 5", "SMALL 4"];
            
            function update() {
                const now = new Date();
                const ms = now.getTime();
                
                const periodIndex = Math.floor(ms / 30000);
                const seed = periodIndex * 123;
                const idx = Math.floor(Math.abs(Math.sin(seed) * data.length)) % data.length;
                
                const result = data[idx];
                const resEl = document.getElementById("orb-res");
                
                resEl.innerText = result;
                resEl.style.color = result.includes("BIG") ? "#00f3ff" : "#ff00ff";
                resEl.style.textShadow = `0 0 10px ${resEl.style.color}`;

                const timer = 30 - (Math.floor(ms / 1000) % 30);
                document.getElementById("orb-timer").innerText = timer;
                document.getElementById("orb-clock").innerText = now.toLocaleTimeString();
            }

            setInterval(update, 1000);
            update();
        }

        // ক্লক সিস্টেম সবসময় চালু রাখার জন্য
        setInterval(() => {
            const now = new Date();
            document.getElementById("orb-clock").innerText = now.toLocaleTimeString();
        }, 1000);
    </script>
</body>
</html>
